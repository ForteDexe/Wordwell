<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local English selection test</title>
<body>
<h1>Selection popup test</h1>
<p>This page is an ordinary website fixture. Its policy blocks page scripts and inline styles.</p>
<label for="paragraph">A normal text box</label><br>
<textarea id="paragraph" rows="7" cols="75" spellcheck="false">Yesterday I go to the shop and buy some milk.</textarea>
<p><label for="sentence">A single-line field</label><br><input id="sentence" type="text" size="75" value="He go to work every day."></p>
<p><label for="private">A password field</label><br><input id="private" type="password" value="keepthisprivate"></p>
<p><label for="readonly">A read-only field</label><br><textarea id="readonly" readonly rows="2" cols="75">This must not offer a selection icon.</textarea></p>
<p>Basic rich text:</p><div id="rich" contenteditable="true" tabindex="0">I very like this extension.</div>
</body>
</html>
